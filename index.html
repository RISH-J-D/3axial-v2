<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png"
    href="https://www.3axialsteeldetail.com/wp-content/uploads/2025/06/3axial-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3axial Steel Detailing Services Pvt. Ltd. | Premier Global Steel Detailers</title>
  <meta name="description"
    content="3axial Steel Detailing Services Pvt. Ltd. provides high-precision 3D Tekla steel modeling, ADSC connection design, pre-bid estimations, and architectural CAD services globally." />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #fdfdfe;
      color: #0f172a;
      overflow-x: hidden;
    }
  </style>

  <!-- Google Fonts: Sora (Display & Headings), Manrope (Body), Instrument Serif (Quotes/Accents), JetBrains Mono (Technical Labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- Hidden anchor for Google Translate DOM bridge -->
  <div id="google_translate_element" style="position:absolute;top:-9999px;left:-9999px;opacity:0;pointer-events:none;"></div>

  <script type="text/javascript">
    // Safe guard for React DOM reconciler when Google Translate inserts <font> wrappers
    if (typeof Node === 'function' && Node.prototype) {
      const origRemoveChild = Node.prototype.removeChild;
      Node.prototype.removeChild = function(child) {
        if (child.parentNode !== this) {
          if (typeof console !== 'undefined' && console.warn) {
            console.warn('[Translate] Handled parentNode mismatch on removeChild');
          }
          return child;
        }
        return origRemoveChild.apply(this, arguments);
      };

      const origInsertBefore = Node.prototype.insertBefore;
      Node.prototype.insertBefore = function(newNode, refNode) {
        if (refNode && refNode.parentNode !== this) {
          if (typeof console !== 'undefined' && console.warn) {
            console.warn('[Translate] Handled parentNode mismatch on insertBefore');
          }
          return newNode;
        }
        return origInsertBefore.apply(this, arguments);
      };
    }

    // Google Translate element initializer
    function googleTranslateElementInit() {
      if (window.google && window.google.translate) {
        new window.google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: false
        }, 'google_translate_element');
      }
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
